name: CI Smoke (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    name: Upload release-shaped artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Assert Node runtime
        run: |
          set -euo pipefail
          node --version
          case "$(node --version)" in v22.*) ;; *) echo "unexpected node" >&2; exit 1;; esac

      - name: Build fake release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          echo "fake apk payload" > release-assets/sub2api-mate-arm64-v8a.apk
          (
            cd release-assets
            sha256sum "sub2api-mate-arm64-v8a.apk" > "sub2api-mate-arm64-v8a.apk.sha256"
          )

      - name: Upload release asset bundle
        uses: actions/upload-artifact@v6
        with:
          name: android-release-arm64-v8a
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  download:
    name: Download merged artifacts
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          pattern: android-release-*
          merge-multiple: true
          path: release-assets

      - name: Assert restored assets
        shell: bash
        run: |
          set -euo pipefail
          ls -l release-assets
          test -f release-assets/sub2api-mate-arm64-v8a.apk
          test -f release-assets/sub2api-mate-arm64-v8a.apk.sha256
          (
            cd release-assets
            sha256sum -c sub2api-mate-arm64-v8a.apk.sha256
          )

  expo:
    name: Expo/EAS action runtime
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Assert EAS CLI available
        run: eas --version
